<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wenoble Dashboard">
  <link rel="icon" type="image/svg+xml" href="./src/assets/icon/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
  <link rel="mask-icon" href="/mask-icon.svg" color="#FFFFFF">
  <meta name="theme-color" content="#ffffff">
  <title>Wenoble Dashboard</title>
  <!-- Force les scripts à utiliser le bon type MIME -->
  <script type="importmap">
    {
      "imports": {}
    }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
  window.addEventListener('error', (e) => {
    const isChunkError = e?.target?.tagName === 'SCRIPT' && e?.target?.src?.includes('/assets/');
    if (isChunkError) {
      // Recharge forcée si une erreur de chunk JS
      console.warn('[PWA] Chunk load error. Forcing reload.');
      caches.keys().then((names) => {
        for (let name of names) caches.delete(name); // Vide les caches SW
      }).finally(() => {
        location.reload(true);
      });
    }
  }, true);
</script>
</body>
</html>
